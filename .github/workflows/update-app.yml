name: update-app

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
  push:
    branches:
      - 'master'
  pull_request:
    paths:
      - '.github/workflows/update-app.yml'
      - 'build.properties'

jobs:
  update:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    environment: update-app # secrets are gated by this environment
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      -
        name: GitHub auth token from GitHub App
        id: write-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PORTAPPS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PORTAPPS_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      -
        name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ steps.write-app.outputs.token }}
          fetch-depth: 0
          persist-credentials: false
      -
        name: Update Nextcloud
        id: update
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: &update-script |
            const fs = require('fs');
            const path = require('path');

            const { data: release } = await github.rest.repos.getLatestRelease({
              owner: 'nextcloud',
              repo: 'desktop'
            });
            const match = /^v(\d+\.\d+\.\d+)$/.exec(release.tag_name);
            if (!match) {
              throw new Error(`Unexpected Nextcloud release tag: ${release.tag_name}`);
            }

            const version = match[1];
            const downloadUrl = `https://download.nextcloud.com/desktop/releases/Windows/Nextcloud-${version}-x64.msi`;
            const filePath = path.join(process.env.GITHUB_WORKSPACE, 'build.properties');
            const content = fs.readFileSync(filePath, 'utf8');
            const versionMatch = /^app\.version[ \t]*=[ \t]*(\d+(?:\.\d+)*)[ \t]*$/m.exec(content);
            const releaseMatch = /^app\.release[ \t]*=[ \t]*(\d+)[ \t]*$/m.exec(content);
            if (!versionMatch || !releaseMatch) {
              throw new Error('Missing or invalid app.version or app.release in build.properties');
            }

            const currentVersion = versionMatch[1];
            const compareVersions = (left, right) => {
              const a = left.split('.').map(Number);
              const b = right.split('.').map(Number);
              for (let i = 0; i < Math.max(a.length, b.length); i++) {
                const difference = (a[i] || 0) - (b[i] || 0);
                if (difference) return difference;
              }
              return 0;
            };

            if (compareVersions(version, currentVersion) <= 0) {
              core.info(`No update: current ${currentVersion}, latest stable ${version}`);
            } else {
              const response = await fetch(downloadUrl, { method: 'HEAD' });
              if (!response.ok) {
                throw new Error(`Nextcloud ${version} x64 MSI is unavailable: ${response.status} ${downloadUrl}`);
              }
              const nextRelease = Number(releaseMatch[1]) + 1;
              if (!Number.isSafeInteger(nextRelease)) {
                throw new Error(`Invalid app.release: ${releaseMatch[1]}`);
              }
              const updated = content
                .replace(versionMatch[0], `app.version = ${version}`)
                .replace(releaseMatch[0], `app.release = ${nextRelease}`);
              fs.writeFileSync(filePath, updated, 'utf8');
              core.info(`Updated build.properties from ${currentVersion} to ${version}`);
            }

            core.setOutput('title', `Nextcloud ${version}`);
            core.setOutput('version', version);
      -
        name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: ${{ github.event.repository.default_branch }}
          branch: update-nextcloud
          token: ${{ steps.write-app.outputs.token }}
          commit-message: ${{ steps.update.outputs.title }}
          title: ${{ steps.update.outputs.title }}
          signoff: true
          sign-commits: true
          delete-branch: true
          body: |
            This updates Nextcloud to ${{ steps.update.outputs.version }}.

  diff:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      -
        name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      -
        name: Update Nextcloud
        id: update
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: *update-script
      -
        name: Show diff
        shell: pwsh
        run: |
          $diff = git --no-pager diff -- build.properties
          if ($diff) {
            $diff
          } else {
            Write-Host "No update diff."
          }
